name: Garmin to Notion Sync

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: .env
      
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Cache Garmin OAuth Tokens
        uses: actions/cache@v4
        id: garmin-tokens
        with:
          path: ~/.garminconnect
          key: garmin-tokens-${{ github.run_id }}
          restore-keys: |
            garmin-tokens-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Seed Garmin tokens from secret if not cached
        if: env.GARMIN_TOKENS_JSON != ''
        env:
          GARMIN_TOKENS_JSON: ${{ secrets.GARMIN_TOKENS_JSON }}
        run: |
          mkdir -p ~/.garminconnect
          if [ ! -f ~/.garminconnect/garmin_tokens.json ]; then
            echo "$GARMIN_TOKENS_JSON" > ~/.garminconnect/garmin_tokens.json
            chmod 600 ~/.garminconnect/garmin_tokens.json
          fi

      - name: Run sync
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          GARMIN_TOKENS_JSON: ${{ secrets.GARMIN_TOKENS_JSON }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          GARMIN_TOKENSTORE: ~/.garminconnect
          TIMEZONE: ${{ vars.TIMEZONE || 'UTC' }}
          GARMIN_DAYS_BACK: ${{ vars.GARMIN_DAYS_BACK || '30' }}
          GARMIN_ACTIVITIES_FETCH_LIMIT: ${{ vars.GARMIN_ACTIVITIES_FETCH_LIMIT || '1000' }}
          PYTHONPATH: src
        run: python -m garmin_to_notion all
